<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Caja de Chat</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f1f1f1;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-container {
      background-color: #f59ff8;
      border: 1px solid #e705fc;
      border-radius: 8px;
      width: 300px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    .chat-box {
      height: 200px;
      border: 1px solid #ddd;
      margin-bottom: 10px;
      padding: 10px;
      overflow-y: auto;
      background-color: #fafafa;
    }

    .input-box {
      width: 100%;
    }

    .input-box input {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
  </style>
</head>

<body>
  <div class="chat-container">
    <div class="chat-box" id="chatBox">
      <!-- Mensajes aparecerán aquí -->
    </div>
    <div class="input-box">
      <input type="text" id="chatInput" placeholder="Escribe un mensaje..." />
    </div>
  </div>

  <script>
    const input = document.getElementById('chatInput');

    input.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        event.preventDefault(); // Evita salto de línea si fuera textarea
        const message = input.value.trim();
        if (message !== '') {
          fetch("https://python-pusher.onrender.com", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ message: message })
          })
            .then((res) => res.json())
            .then((data) => {
              console.log("Respuesta del servidor:", data);
            })
          input.value = ''; // Limpia el input después del envío
        }
      }
    });
  </script>
</body>

</html>
