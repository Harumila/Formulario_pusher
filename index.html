<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Chat</title>
  <script src="https://js.pusher.com/8.4.0/pusher.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f1f1;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-container {
      width: 400px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      background: #f8abf4;
      color: #fff;
      padding: 15px;
      font-size: 18px;
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
    }

    .chat-messages {
      padding: 15px;
      height: 300px;
      overflow-y: auto;
      border-bottom: 1px solid #ccc;
    }

    .chat-message {
      margin-bottom: 10px;
    }

    .chat-input {
      display: flex;
    }

    .chat-input input {
      flex: 1;
      padding: 10px;
      border: none;
      border-bottom-left-radius: 8px;
    }

    .chat-input button {
      padding: 10px 15px;
      border: none;
      background: #ff008c;
      color: white;
      cursor: pointer;
      border-bottom-right-radius: 8px;
    }

    .chat-input button:hover {
      background: #c530a0;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">Chat en Tiempo Real</div>
    <div class="chat-messages" id="chatMessages"></div>
    <form class="chat-input" id="chatForm">
      <input type="text" id="messageInput" placeholder="Escribe un mensaje..." required>
      <button type="submit">Enviar</button>
    </form>
  </div>

  <script>
    // Activar el log de Pusher (solo para desarrollo)
    Pusher.logToConsole = true;

    // Configuración de Pusher
    var pusher = new Pusher('8991fbde10313380964c', {
      cluster: 'ap3'
    });

    // Suscribirse al canal
    var channel = pusher.subscribe('my-channel');

    // Escuchar eventos entrantes
    channel.bind('my-event', function(data) {
      mostrarMensaje(data.message);
    });

    // Mostrar mensaje en el chat
    function mostrarMensaje(mensaje) {
      const chatMessages = document.getElementById("chatMessages");
      const div = document.createElement("div");
      div.classList.add("chat-message");
      div.textContent = mensaje;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // Enviar mensaje (solo localmente)
    document.getElementById("chatForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const input = document.getElementById("messageInput");
      const mensaje = input.value;

      // Esto solo muestra el mensaje localmente
      mostrarMensaje("Tú: " + mensaje);

      // Aquí normalmente se llamaría a tu servidor para emitir el evento con Pusher
      // Por ejemplo con fetch("/send-message", { method: "POST", body: ... })

      input.value = "";
    });
  </script>
</body>
</html>
